<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#88c85c"><meta name="description" content="Jet-powered DeLorean. Irish back roads. Last orders."><title>Turbine Run</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="src/style.css"></head>
<body><canvas id="stage" aria-label="3D Irish countryside driving game"></canvas>
<header><span class="arcade-mark">IRISHCHUD<span>ARCADE</span></span><nav><button id="sound" aria-label="Enable sound" aria-pressed="false">♪</button><button id="pause" aria-label="Pause" hidden>Ⅱ</button></nav></header>
<section id="intro"><div class="title"><span class="badge">DUNMURRY, 1981 · AFTER HOURS</span><h1>TURBINE<span>RUN</span></h1></div><div class="launch"><button class="primary" id="start">LET’S GO <span>➜</span></button><p class="how">← → steer &nbsp; SPACE jump &nbsp; SHIFT boost</p><p class="mobile-how">Swipe to steer · swipe up to jump</p></div></section>
<section id="hud" aria-label="Game status" hidden><div class="hud-top"><div class="pill"><span class="pint-icon">▰</span><b id="pints">0</b></div><div class="pill" id="hearts" aria-label="Three bodywork points">♥ ♥ ♥</div></div><div class="route"><div id="route-fill"></div></div><div class="route-label"><span id="distance">6.2 KM</span><span>THE TURBINE ARMS ⚑</span></div><div class="speed"><b id="speed">72</b><small>MPH</small></div><div id="boost" hidden>JET BOOST</div></section>
<div id="notice" role="status" aria-live="polite"></div>
<section id="result" hidden role="dialog" aria-modal="true" aria-labelledby="result-title"><div class="result-card"><span class="badge" id="result-label">PIT STOP</span><h2 id="result-title"></h2><p id="result-copy"></p><div id="result-stats"></div><button id="again" class="primary">GO AGAIN ➜</button></div></section>
<div id="controls" hidden><button id="left" aria-label="Steer left">←</button><button id="jump" aria-label="Jet jump">↑<small>JUMP</small></button><button id="jet" aria-label="Boost">⚡<small id="fuel">0</small></button><button id="right" aria-label="Steer right">→</button></div>
<div id="error" hidden role="alert"><h2>Engine trouble.</h2><p>This game needs WebGL. Try a browser with hardware acceleration enabled.</p></div><noscript>This game needs JavaScript.</noscript>
<script type="module" src="src/main.js"></script></body></html>
